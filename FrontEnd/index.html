<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon / Logo -->
    <link rel="icon" type="image/png" sizes="32x32" href="/new_logo2.png" />
    <link rel="apple-touch-icon" href="/new_logo2.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Poppins:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Viewport & Theme Color -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />

    <!-- 🔥 SEO Baseline Title & Description -->
    <title>Wink & Wear | Online Fashion Store for Men, Women & Kids</title>
    <meta
      name="description"
      content="Shop stylish fashion for men, women and kids at Wink & Wear. Discover modern clothing and everyday styles online."
    />

    <!-- 🔥 Search Engine Signals & Canonical -->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Wink & Wear" />
    <link rel="canonical" href="https://winkandwear.com/" />

    <!-- 🔥 Open Graph (Social Cards) -->
    <meta property="og:site_name" content="Wink & Wear" />
    <meta property="og:title" content="Wink & Wear | Online Fashion Store for Men, Women & Kids" />
    <meta
      property="og:description"
      content="Discover stylish fashion for men, women and kids at Wink & Wear."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://winkandwear.com/" />
    <meta property="og:image" content="https://winkandwear.com/new_logo2.png" />
    <meta property="og:image:alt" content="Wink & Wear fashion store" />
    <meta property="og:locale" content="en_IN" />

    <!-- 🔥 Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wink & Wear | Online Fashion Store for Men, Women & Kids" />
    <meta
      name="twitter:description"
      content="Discover stylish fashion for men, women and kids at Wink & Wear."
    />
    <meta name="twitter:image" content="https://winkandwear.com/new_logo2.png" />

    <!-- 🔥 Structured Data (Logo & Organization Baseline) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Wink & Wear",
        "url": "https://winkandwear.com",
        "logo": "https://winkandwear.com/new_logo2.png"
      }
    </script>

    <!-- Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
